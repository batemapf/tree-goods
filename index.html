<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Ordinary Tree Goods - Handcrafted furniture and wood goods from Washington, D.C." />
  <title>Ordinary Tree Goods</title>

  <link rel="icon" href="assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header class="hero" role="banner">
    <div class="wrap center">
      <img class="logo" src="assets/logo-primary-black.png" alt="Ordinary Tree Goods - Handcrafted furniture and wood goods" />
    </div>
  </header>

  <main id="main-content" class="wrap">
    <section id="work" class="section" aria-label="Featured work">
      <h2 class="visually-hidden">Featured Work</h2>
      <div class="grid" role="list">
        <article class="card" role="listitem">
          <div class="thumb" role="img" aria-label="Product image placeholder"></div>
        </article>
        <article class="card" role="listitem">
          <div class="thumb" role="img" aria-label="Product image placeholder"></div>
        </article>
        <article class="card" role="listitem">
          <div class="thumb" role="img" aria-label="Product image placeholder"></div>
        </article>
      </div>
    </section>

    <section id="contact" class="section" aria-label="Contact information">
      <h2 class="visually-hidden">Contact</h2>
      <p class="contact-line"><a href="mailto:work@ordinarytreegoods.com">work@ordinarytreegoods.com</a> | Washington, D.C.</p>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <span>© <span id="year"></span> Ordinary Tree Goods</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
